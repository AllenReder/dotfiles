#
# sample hyprlock.conf
# for more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock
#
# rendered text in all widgets supports pango markup (e.g. <b> or <i> tags)
# ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#general-remarks
#
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace
#
# you can get started by copying this config to ~/.config/hypr/hyprlock.conf
#

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = appleEase, 0.25, 0.1, 0.25, 1.0
    bezier = appleInOut, 0.42, 0.0, 0.58, 1.0
    animation = fade, 1, 2.2, appleEase
    animation = inputField, 1, 2.4, appleInOut
    animation = inputFieldDots, 1, 2.4, appleInOut
}

background {
    monitor =
    path = ~/.config/omarchy/current/background
    blur_size = 4 # 模糊半径
    blur_passes = 3 # 模糊强度/次数
}


input-field {
    monitor =
    size = 20%, 5%
    position = 0, -100
    halign = center
    valign = center

    inner_color = rgba(0,0,0,0.1)
    outer_color = rgba(255, 255, 255, 0.08)
    outline_thickness = 1

    font_family = $font
    font_color = rgba(255, 255, 255, 0.7)
    fade_on_empty = false

    placeholder_text = Enter Password
    check_color = $check_color
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    fade_timeout = 0

    rounding = 999
    shadow_passes = 20
}

# TIME
label {
    monitor =
    text = $TIME # ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution
    font_size = 90
    font_family = Note Sans

    position = 0, 200
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
    font_size = 25
    # font_family = $font

    position = 0, 320
    halign = center
    valign = center
}
