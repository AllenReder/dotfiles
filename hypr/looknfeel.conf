# Change the default Omarchy look'n'feel

# https://wiki.hyprland.org/Configuring/Variables/#general
general { # 通用窗口布局相关
    # No gaps between windows or borders
    gaps_in = 4 # 窗口之间的内间距
    gaps_out = 8 # 窗口与屏幕边缘的外间距
    border_size = 2 # 窗口边框粗细

    # Use master layout instead of dwindle
    # layout = master # 使用主从布局（注释表示不启用）
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration { # 窗口装饰相关
    # Use round window corners
    rounding = 12 # 窗口圆角半径
    blur { # 背景模糊相关
        enabled = true # 是否启用模糊
        size = 4 # 模糊半径
        passes = 3 # 模糊强度/次数
        new_optimizations = true # 启用新版模糊优化
    }
}

windowrule = opacity 0.95 0.6, match:class .* # 全局透明度：聚焦/非聚焦


# https://wiki.hypr.land/Configuring/Dwindle-Layout/
dwindle { # Dwindle 布局相关
    # Avoid overly wide single-window layouts on wide screens
    # single_window_aspect_ratio = 1 1 # 单窗口宽高比限制（注释表示不启用）
}

# https://wiki.hyprland.org/Configuring/Animations/
animations { # 动画曲线与速度（偏 Apple 风格）
    enabled = yes # 启用动画
    bezier = appleEase,0.25,0.1,0.25,1.0 # 通用平滑曲线（类似 Apple）
    bezier = appleInOut,0.42,0,0.58,1.0 # 进出平滑曲线
    animation = global, 1, 6, appleEase # 全局动画速度（更紧凑）
    animation = border, 1, 4.0, appleEase # 边框动画速度
    animation = windows, 1, 3.0, appleEase # 窗口动画速度
    animation = windowsIn, 1, 2.6, appleInOut, popin 86% # 窗口进入动画
    animation = windowsOut, 1, 2.4, appleInOut, popin 86% # 窗口退出动画
    animation = fadeIn, 1, 2.0, appleEase # 淡入动画
    animation = fadeOut, 1, 1.8, appleEase # 淡出动画
    animation = fade, 1, 2.0, appleEase # 通用淡入淡出
    animation = layers, 1, 2.6, appleEase # 图层动画（如菜单/通知）
    animation = layersIn, 1, 2.6, appleInOut, fade # 图层进入动画
    animation = layersOut, 1, 2.2, appleInOut, fade # 图层退出动画
    animation = workspaces, 1, 2.4, appleInOut # 工作区切换动画
}

layerrule = blur on, match:namespace walker
layerrule = ignore_alpha 0.05, match:namespace walker

layerrule = blur on, match:namespace waybar
# layerrule = blur_popups on, match:namespace waybar
layerrule = ignore_alpha 0.05, match:namespace waybar

layerrule = blur on, match:namespace ironbar
layerrule = blur_popups on, match:namespace ironbar
layerrule = ignore_alpha 0.05, match:namespace ironbar
