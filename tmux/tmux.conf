# File: tmux.conf - Local tmux overrides for oh-my-tmux.
# Local tmux overrides for oh-my-tmux.

# Use Ctrl-a as prefix (uncomment if you prefer default Ctrl-b)
# set -g prefix C-a
# unbind C-b
# bind C-a send-prefix

set -g mouse on
set -g history-limit 10000

# Status bar tweaks
set -g status-interval 5
set -g status-justify left

# Use the user's login shell inside tmux.
set -g default-shell "$SHELL"
set -g default-command "$SHELL"
